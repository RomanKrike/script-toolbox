name: Apply 0.4.0 payload

on:
  push:
    branches:
      - feature/editor-runtime-0.4
    paths:
      - '.tmp/payload.*'
      - '.github/workflows/apply-040-payload.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild source payload
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/payload.* > /tmp/script-toolbox-040.b64
          base64 --decode /tmp/script-toolbox-040.b64 > /tmp/script-toolbox-040.tar.xz
          tar -xJf /tmp/script-toolbox-040.tar.xz

      - name: Verify payload
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PLUGIN_VERSION = "0.4.0"' scripts/script_toolbox/constants.py || true
          test -f scripts/script_toolbox/ui/interface_editor.py
          test -f scripts/script_toolbox/ui/main_window.py
          test -f scripts/script_toolbox/ui/runtime.py

      - name: Commit expanded sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp
          rm -f .github/workflows/apply-040-payload.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply Script Toolbox 0.4.0 editor and runtime sources'
          git push
