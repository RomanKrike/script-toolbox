name: Apply 0.4.1 UI fixes

on:
  push:
    branches:
      - fix/0.4.1-ui-regressions
    paths:
      - '.tmp/fix_041.py'
      - '.github/workflows/apply-041-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.4.1-ui-regressions
          fetch-depth: 0
      - name: Apply patch
        run: python .tmp/fix_041.py
      - name: Remove temporary applicator
        run: |
          rm -f .tmp/fix_041.py
          rmdir .tmp 2>/dev/null || true
          rm -f .github/workflows/apply-041-fix.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix 0.4.1 Interface Editor regressions"
          git push origin HEAD:fix/0.4.1-ui-regressions
