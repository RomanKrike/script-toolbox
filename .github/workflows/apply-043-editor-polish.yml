name: Apply 0.4.3 editor polish

on:
  push:
    branches:
      - fix/0.4.3-editor-polish
    paths:
      - .github/workflows/apply-043-editor-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/0.4.3-editor-polish
          fetch-depth: 0

      - name: Apply editor polish
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          # ----------------------------------------------------------
          # Interface Editor palette + deterministic Qt4 backgrounds
          # ----------------------------------------------------------
          path = "scripts/script_toolbox/ui/interface_editor.py"
          text = read(path)

          new_groups = '''    PALETTE_GROUPS = (
              (
                  "LAYOUT",
                  (
                      ("Folder", "folder", "Container: Collapsible, Simple, Tabs or Radio."),
                      ("Row", "row", "Horizontal layout for compact controls and buttons."),
                      ("Label", "label", "Static text for headings and notes."),
                      ("Separator", "separator", "Visual divider between parameter groups."),
                  )
              ),
              (
                  "INPUTS",
                  (
                      ("Field", "field", "Manual value or live DCC selection."),
                      ("String", "string", "Editable text value."),
                      ("Integer", "integer", "Integer value with min, max and step."),
                      ("Float", "float", "Floating-point value with range and precision."),
                      ("Checkbox", "checkbox", "Boolean on/off value."),
                      ("Menu", "menu", "Choose one value from a list."),
                      ("Color", "color", "RGB color value."),
                  )
              ),
              (
                  "ACTIONS",
                  (
                      ("Button", "button", "Run Python or the active host native script language."),
                  )
              ),
          )
'''
          text, count = re.subn(
              r'    PALETTE_GROUPS = \(.*?\n    \)\n\n    def __init__',
              new_groups + '\n    def __init__',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("Could not replace PALETTE_GROUPS")

          old = '''        self.palette.setAlternatingRowColors(
              False
          )'''
          new = '''        self.palette.setAlternatingRowColors(
              True
          )'''
          if old not in text:
              raise RuntimeError("Palette alternating-row block not found")
          text = text.replace(old, new, 1)

          marker = '''        self.property_scroll.setHorizontalScrollBarPolicy(
              QtCore.Qt.ScrollBarAlwaysOff
          )
'''
          replacement = marker + '''
          # Maya 2015 / Qt4 does not consistently honor QScrollArea viewport
          # background selectors. Set the viewport palette explicitly so the
          # property pane stays visually identical to EditorPane.
          try:
              viewport = self.property_scroll.viewport()
              viewport.setObjectName("PropertyViewport")
              viewport_palette = viewport.palette()
              viewport_palette.setColor(
                  QtGui.QPalette.Window,
                  QtGui.QColor("#303030")
              )
              viewport_palette.setColor(
                  QtGui.QPalette.Base,
                  QtGui.QColor("#303030")
              )
              viewport.setPalette(viewport_palette)
              viewport.setAutoFillBackground(True)
          except Exception:
              pass
'''
          if marker not in text:
              raise RuntimeError("PropertyScroll marker not found")
          text = text.replace(marker, replacement, 1)

          marker = '''        self.property_host.setObjectName(
              "PropertyHost"
          )
'''
          replacement = marker + '''        try:
              host_palette = self.property_host.palette()
              host_palette.setColor(
                  QtGui.QPalette.Window,
                  QtGui.QColor("#303030")
              )
              host_palette.setColor(
                  QtGui.QPalette.Base,
                  QtGui.QColor("#303030")
              )
              self.property_host.setPalette(host_palette)
              self.property_host.setAutoFillBackground(True)
          except Exception:
              pass
'''
          if marker not in text:
              raise RuntimeError("PropertyHost marker not found")
          text = text.replace(marker, replacement, 1)
          write(path, text)

          # ----------------------------------------------------------
          # Property editor root background
          # ----------------------------------------------------------
          path = "scripts/script_toolbox/ui/properties/base.py"
          text = read(path)
          init_line = '''        QtGui.QWidget.__init__(self, parent)
'''
          root_palette = '''        QtGui.QWidget.__init__(self, parent)

          self.setObjectName("PropertyEditor")
          try:
              editor_palette = self.palette()
              editor_palette.setColor(
                  QtGui.QPalette.Window,
                  QtGui.QColor("#303030")
              )
              editor_palette.setColor(
                  QtGui.QPalette.Base,
                  QtGui.QColor("#303030")
              )
              self.setPalette(editor_palette)
              self.setAutoFillBackground(True)
          except Exception:
              pass
'''
          if text.count(init_line) < 2:
              raise RuntimeError("Expected PropertyEditor QWidget init blocks")
          text = text.replace(init_line, root_palette, 1)

          # Empty editor gets the same deterministic panel background.
          empty_anchor = '''class EmptyPropertyEditor(QtGui.QWidget):

              def __init__(self, toolbox=None, parent=None):
                  QtGui.QWidget.__init__(self, parent)
'''
          empty_replacement = '''class EmptyPropertyEditor(QtGui.QWidget):

              def __init__(self, toolbox=None, parent=None):
                  QtGui.QWidget.__init__(self, parent)
                  self.setObjectName("PropertyEditor")
                  try:
                      editor_palette = self.palette()
                      editor_palette.setColor(
                          QtGui.QPalette.Window,
                          QtGui.QColor("#303030")
                      )
                      editor_palette.setColor(
                          QtGui.QPalette.Base,
                          QtGui.QColor("#303030")
                      )
                      self.setPalette(editor_palette)
                      self.setAutoFillBackground(True)
                  except Exception:
                      pass
'''
          if empty_anchor not in text:
              raise RuntimeError("EmptyPropertyEditor anchor not found")
          text = text.replace(empty_anchor, empty_replacement, 1)
          write(path, text)

          # ----------------------------------------------------------
          # QSS: native Maya combo arrows + matching zebra palette
          # ----------------------------------------------------------
          path = "scripts/script_toolbox/style/stylesheet.py"
          text = read(path)

          old = '''QScrollArea#PropertyScroll,
          QScrollArea#PropertyScroll QWidget#qt_scrollarea_viewport,
          QWidget#PropertyHost {
              background-color: #303030;
              border: 0px;
          }
'''
          new = '''QScrollArea#PropertyScroll,
          QWidget#PropertyViewport,
          QWidget#PropertyHost,
          QWidget#PropertyEditor {
              background-color: #303030;
              border: 0px;
          }
'''
          if old not in text:
              raise RuntimeError("PropertyScroll QSS block not found")
          text = text.replace(old, new, 1)

          text, count = re.subn(
              r'\nQComboBox \{\n    padding-right: 25px;\n\}\n\nQComboBox::drop-down \{.*?\nQComboBox:disabled::drop-down \{.*?\n\}\n',
              '\n/* Keep the host-native ComboBox drop-down/arrow. Maya 2015 Qt4\n   loses the arrow when QSS replaces these subcontrols. */\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError("Custom ComboBox subcontrol QSS not found")

          old = '''QTreeWidget#ParameterPalette {
              background-color: #262626;
              border-color: #191919;
          }
'''
          new = '''QTreeWidget#ParameterPalette {
              background-color: #242424;
              border-color: #191919;
              alternate-background-color: #282828;
          }
'''
          if old not in text:
              raise RuntimeError("ParameterPalette QSS block not found")
          text = text.replace(old, new, 1)
          write(path, text)

          # ----------------------------------------------------------
          # Version + changelog
          # ----------------------------------------------------------
          path = "scripts/script_toolbox/constants.py"
          text = read(path)
          text = text.replace('PLUGIN_VERSION = "0.4.2"', 'PLUGIN_VERSION = "0.4.3"', 1)
          write(path, text)

          path = "MayaScriptToolbox.mod"
          text = read(path)
          text = text.replace('+ MayaScriptToolbox 0.4.2 .', '+ MayaScriptToolbox 0.4.3 .', 1)
          write(path, text)

          path = "CHANGELOG.md"
          text = read(path)
          entry = '''# Changelog

          ## 0.4.3

          Interface Editor Qt4 polish release.

          ### Fixed

          - Force Parameter Description viewport, host and property-editor backgrounds through QPalette for Maya 2015 Qt4.
          - Restore the host-native ComboBox drop-down and arrow instead of replacing the Qt4 subcontrols with QSS.
          - Match Create Parameters alternating rows to Existing Parameters.
          - Move Label and Separator into Layout and remove the redundant Display palette group.

'''
          if not text.startswith("# Changelog\n"):
              raise RuntimeError("Unexpected CHANGELOG header")
          text = text.replace("# Changelog\n\n", entry, 1)
          write(path, text)

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md MayaScriptToolbox.mod scripts/script_toolbox/constants.py scripts/script_toolbox/style/stylesheet.py scripts/script_toolbox/ui/interface_editor.py scripts/script_toolbox/ui/properties/base.py
          git commit -m "Fix 0.4.3 Interface Editor Qt4 polish"
          git push origin HEAD:fix/0.4.3-editor-polish
