name: Python checks

on:
  push:
    branches:
      - main
      - refactor/**
  pull_request:

jobs:
  model-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile package
        run: python -m compileall scripts/script_toolbox

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run Maya-independent model tests
        run: pytest -q tests/test_model_smoke.py
