name: Auto release

on:
  workflow_run:
    workflows: ["Python checks"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: script-toolbox-release
  cancel-in-progress: false

jobs:
  source:
    name: Resolve stable release source
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      needed: ${{ steps.version.outputs.needed }}
    steps:
      - name: Resolve checked source revision
        id: source
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve version and existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "from tools.build_release import read_plugin_version, repository_root; print(read_plugin_version(repository_root()))")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > existing-draft.txt 2>/dev/null; then
            if [ "$(cat existing-draft.txt)" = "false" ]; then
              echo "needed=false" >> "$GITHUB_OUTPUT"
              echo "Release $TAG is already published."
              exit 0
            fi
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-list -n 1 "$TAG")" != "${{ steps.source.outputs.sha }}" ]; then
              echo "Existing $TAG points to a different source revision." >&2
              exit 1
            fi
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

  plugin:
    name: Build stable plugin package
    needs: source
    if: needs.source.outputs.needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Stamp telemetry client config
        env:
          POSTHOG_PROJECT_TOKEN: ${{ secrets.POSTHOG_PROJECT_TOKEN }}
          POSTHOG_HOST: https://eu.i.posthog.com
        run: python tools/stamp_telemetry_config.py
      - name: Build and validate release package
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: python tools/build_release.py --output dist --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: stable-plugin
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error

  portable:
    name: Build stable standalone package
    needs: source
    if: needs.source.outputs.needed == 'true'
    uses: ./.github/workflows/standalone-build.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}
      artifact_name: stable-standalone
    secrets: inherit

  publish:
    name: Publish complete stable release
    needs: [source, plugin, portable]
    if: >
      always() && needs.source.outputs.needed == 'true' &&
      needs.plugin.result == 'success' && needs.portable.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: stable-plugin
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: stable-standalone
          path: dist
      - name: Verify both packages before publication
        env:
          VERSION: ${{ needs.source.outputs.version }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python tools/prepare_stable_publication.py dist "$VERSION" "$SOURCE_SHA"
      - name: Create immutable version tag
        env:
          TAG: ${{ needs.source.outputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            test "$(git rev-list -n 1 "$TAG")" = "$SOURCE_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$SOURCE_SHA" -m "Script Toolbox $TAG"
            git push origin "$TAG"
          fi
      - name: Publish verified assets together
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source.outputs.version }}
          TAG: ${{ needs.source.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "Script Toolbox $VERSION"
          fi
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true"
          gh release upload "$TAG" \
            "dist/script-toolbox-$VERSION.zip" \
            "dist/script-toolbox-$VERSION.zip.sha256" \
            "dist/script-toolbox-$VERSION-standalone-windows-x64.zip" \
            "dist/script-toolbox-$VERSION-standalone-windows-x64.zip.sha256" \
            dist/release-build.json --clobber
          gh release edit "$TAG" --draft=false --latest
