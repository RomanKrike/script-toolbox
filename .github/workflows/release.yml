name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate package syntax
        run: python -m compileall scripts/script_toolbox

      - name: Validate tag matches plugin version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          text = open("scripts/script_toolbox/constants.py", "r", encoding="utf-8").read()
          match = re.search(r'^PLUGIN_VERSION\s*=\s*"([^"]+)"', text, re.M)
          if not match:
              raise SystemExit("PLUGIN_VERSION not found")
          print(match.group(1))
          PY
          )
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match PLUGIN_VERSION=$VERSION"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "Script Toolbox $GITHUB_REF_NAME"
