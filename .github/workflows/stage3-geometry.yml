name: Stage 3 geometry migration

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply migration
        run: python tools/stage3_geometry_migration.py

      - name: Run contracts
        run: |
          python -m pip install pytest
          python -m compileall -q scripts/script_toolbox
          pytest -q tests

      - name: Commit migration
        run: |
          rm .github/workflows/stage3-geometry.yml
          rm tools/stage3_geometry_migration.py
          git config user.name "Roman Krike"
          git config user.email "61820604+RomanKrike@users.noreply.github.com"
          git add -A
          git commit -m "Centralize application layout geometry"
          git push origin HEAD:dev
