name: Stage 5 scroll surface contract

on:
  push:
    branches:
      - fix/scroll-surface-contract

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Run scroll surface contract migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply ScrollSurfaceFrame contract
        run: python .github/stage5_scroll_surface_migration.py

      - name: Run contracts
        run: |
          python -m pip install pytest
          python -m compileall -q scripts/script_toolbox
          pytest -q tests

      - name: Commit verified migration
        run: |
          rm .github/stage5_scroll_surface_migration.py
          rm .github/workflows/stage5-scroll-surface.yml
          git config user.name "Roman Krike"
          git config user.email "61820604+RomanKrike@users.noreply.github.com"
          git add -A
          git commit -m "Implement ScrollSurfaceFrame geometry contract"
          git push origin HEAD:fix/scroll-surface-contract
